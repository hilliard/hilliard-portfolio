<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Rectangle Background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="14"
    fill="url(#bg-grad)"
    stroke="url(#gold-border)"
    stroke-width="2.5"
  />

  <!-- Subtle Inner Accent Inset -->
  <rect
    x="5"
    y="5"
    width="54"
    height="54"
    rx="11"
    fill="none"
    stroke="#fbbf24"
    stroke-width="0.75"
    stroke-opacity="0.25"
  />

  <!-- Hardware Tech Corner Accents -->
  <circle cx="8" cy="8" r="1.2" fill="#fbbf24" fill-opacity="0.7" />
  <circle cx="56" cy="8" r="1.2" fill="#fbbf24" fill-opacity="0.7" />
  <circle cx="8" cy="56" r="1.2" fill="#fbbf24" fill-opacity="0.7" />
  <circle cx="56" cy="56" r="1.2" fill="#fbbf24" fill-opacity="0.7" />

  <!-- Monogram HS Text -->
  <text
    x="32"
    y="41"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
    font-size="25"
    font-weight="900"
    fill="url(#gold-text)"
    text-anchor="middle"
    letter-spacing="-1"
    filter="url(#glow)"
  >HS</text>
</svg>
